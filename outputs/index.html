<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trích xuất liên kết BeautyPlus</title>
  <style>
    :root {
      color-scheme:light;
      --text:#17213a; --muted:#68728a; --glass:rgba(255,255,255,.48); --glass-strong:rgba(255,255,255,.68);
      --glass-edge:rgba(255,255,255,.82); --surface:rgba(255,255,255,.58); --surface-solid:#f8faff;
      --line:rgba(117,132,170,.20); --primary:#1677ff; --primary-deep:#3156e8; --primary-soft:rgba(61,126,255,.14);
      --danger:#c92f4a; --danger-bg:rgba(255,226,232,.72); --success:#087d5c; --success-bg:rgba(218,248,237,.68);
      --shadow:0 28px 70px rgba(45,64,112,.16),0 2px 10px rgba(63,81,128,.08);
      --inner:inset 0 1px 0 rgba(255,255,255,.88),inset 0 -1px 0 rgba(105,126,173,.12);
      --url:#33415f;
    }
    :root[data-theme="dark"] {
      color-scheme:dark;
      --text:#f6f8ff; --muted:#a9b1c7; --glass:rgba(23,29,45,.50); --glass-strong:rgba(28,35,53,.72);
      --glass-edge:rgba(255,255,255,.18); --surface:rgba(16,22,36,.60); --surface-solid:#141b2b;
      --line:rgba(210,221,255,.13); --primary:#55a1ff; --primary-deep:#6b6cff; --primary-soft:rgba(83,151,255,.18);
      --danger:#ff8b9e; --danger-bg:rgba(82,28,41,.62); --success:#68e0b5; --success-bg:rgba(21,80,65,.55);
      --shadow:0 32px 80px rgba(0,0,0,.42),0 2px 12px rgba(0,0,0,.28);
      --inner:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.20);
      --url:#c7d2ef;
    }
    * { box-sizing:border-box; }
    html { min-height:100%; background:#dfe9ff; }
    html[data-theme="dark"] { background:#080b14; }
    body { margin:0; min-height:100vh; overflow-x:hidden; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",sans-serif; color:var(--text); background:linear-gradient(145deg,#edf8ff 0%,#f5efff 48%,#fff3f7 100%); transition:color .3s,background .3s; }
    :root[data-theme="dark"] body { background:linear-gradient(145deg,#07101f 0%,#151125 48%,#160d18 100%); }
    body::before,body::after { content:""; position:fixed; z-index:0; border-radius:50%; filter:blur(2px); pointer-events:none; opacity:.88; animation:drift 16s ease-in-out infinite alternate; }
    body::before { width:min(56vw,740px); height:min(56vw,740px); left:-16vw; top:-24vw; background:radial-gradient(circle at 62% 64%,rgba(68,205,255,.68),rgba(85,110,255,.28) 46%,transparent 72%); }
    body::after { width:min(52vw,680px); height:min(52vw,680px); right:-14vw; bottom:-25vw; background:radial-gradient(circle at 36% 32%,rgba(255,119,189,.58),rgba(174,102,255,.28) 48%,transparent 72%); animation-delay:-7s; }
    :root[data-theme="dark"] body::before { opacity:.48; background:radial-gradient(circle at 62% 64%,rgba(28,150,255,.54),rgba(83,76,255,.25) 48%,transparent 72%); }
    :root[data-theme="dark"] body::after { opacity:.42; background:radial-gradient(circle at 36% 32%,rgba(255,62,153,.42),rgba(142,65,255,.24) 48%,transparent 72%); }
    .wrap { position:relative; z-index:1; width:min(1040px,calc(100% - 32px)); margin:0 auto; padding:44px 0 64px; }
    header { position:relative; margin-bottom:18px; }
    .header-row,.card { border:1px solid var(--glass-edge); background:var(--glass); -webkit-backdrop-filter:blur(32px) saturate(185%); backdrop-filter:blur(32px) saturate(185%); box-shadow:var(--shadow),var(--inner); }
    .header-row { position:relative; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 18px 18px 20px; border-radius:32px; overflow:hidden; }
    .header-row::after,.card::before { content:""; position:absolute; pointer-events:none; height:1px; left:10%; right:10%; top:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.92),transparent); opacity:.8; }
    .title-lockup { display:flex; align-items:center; gap:16px; min-width:0; }
    .app-icon { position:relative; flex:0 0 58px; width:58px; height:58px; display:grid; place-items:center; overflow:hidden; color:#fff; border:1px solid rgba(255,255,255,.75); border-radius:18px; background:linear-gradient(145deg,#31c5ff 0%,#4d78ff 46%,#9d54ff 100%); box-shadow:inset 0 1px 1px rgba(255,255,255,.75),inset 0 -8px 18px rgba(38,41,150,.24),0 9px 22px rgba(57,93,215,.26); }
    .app-icon::before { content:""; position:absolute; inset:1px 4px 48%; border-radius:14px 14px 50% 50%; background:linear-gradient(rgba(255,255,255,.72),transparent); filter:blur(1px); }
    .app-icon svg { position:relative; width:30px; height:30px; filter:drop-shadow(0 2px 4px rgba(20,32,100,.22)); }
    .title-copy { min-width:0; }
    .eyebrow { margin:0 0 3px; color:var(--primary); font-size:11px; line-height:1; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0 0 5px; font-size:clamp(24px,4vw,34px); line-height:1.08; letter-spacing:-.04em; font-weight:750; }
    .intro { margin:0; max-width:690px; color:var(--muted); font-size:14px; line-height:1.45; }
    code { padding:.1em .35em; border:1px solid var(--line); border-radius:7px; background:rgba(255,255,255,.22); font-size:.92em; }
    .card { position:relative; overflow:hidden; border-radius:34px; padding:28px; transition:background-color .3s,border-color .3s; }
    .section-head,.actions,.result-head,.link-row { display:flex; align-items:center; gap:12px; }
    .section-head,.result-head { justify-content:space-between; margin-bottom:13px; }
    label,.result-title { font-size:15px; font-weight:760; letter-spacing:-.01em; }
    .hint,.status { color:var(--muted); font-size:13px; }
    textarea { width:100%; min-height:300px; resize:vertical; border:1px solid var(--line); border-radius:22px; padding:18px 20px; color:var(--text); background:var(--surface); box-shadow:inset 0 2px 10px rgba(63,79,118,.06),var(--inner); font:13px/1.62 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; outline:none; transition:border-color .2s,box-shadow .2s,background .2s; }
    textarea::placeholder { color:var(--muted); opacity:.74; }
    textarea:focus { border-color:rgba(63,127,255,.62); background:var(--glass-strong); box-shadow:0 0 0 5px var(--primary-soft),inset 0 1px 0 rgba(255,255,255,.38); }
    .actions { justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
    button,.open-link { position:relative; min-height:44px; overflow:hidden; border-radius:999px; border:1px solid var(--glass-edge); padding:0 17px; color:var(--text); background:var(--glass-strong); box-shadow:0 7px 18px rgba(49,67,113,.10),var(--inner); -webkit-backdrop-filter:blur(18px) saturate(180%); backdrop-filter:blur(18px) saturate(180%); font:inherit; font-size:14px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; transition:transform .18s,box-shadow .18s,background .18s; }
    button::before,.open-link::before { content:""; position:absolute; pointer-events:none; left:15%; right:15%; top:0; height:1px; background:rgba(255,255,255,.9); }
    button:hover,.open-link:hover { transform:translateY(-2px) scale(1.01); box-shadow:0 11px 24px rgba(45,65,118,.16),var(--inner); }
    button:active,.open-link:active { transform:scale(.97); }
    button.primary { color:#fff; border-color:rgba(255,255,255,.52); background:linear-gradient(135deg,var(--primary),var(--primary-deep)); box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -8px 18px rgba(30,44,190,.18),0 10px 24px rgba(46,93,232,.28); }
    button.primary:hover { box-shadow:inset 0 1px 0 rgba(255,255,255,.62),inset 0 -8px 18px rgba(30,44,190,.16),0 14px 30px rgba(46,93,232,.36); }
    button:disabled { opacity:.42; cursor:not-allowed; transform:none; box-shadow:var(--inner); }
    .theme-toggle { flex:0 0 auto; gap:9px; min-height:46px; padding:0 16px; }
    .theme-icon { display:grid; place-items:center; width:23px; height:23px; border-radius:50%; color:#fff; background:linear-gradient(145deg,#66c9ff,#5469f5); box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 10px rgba(53,94,212,.25); font-size:15px; line-height:1; }
    .error { display:none; margin-top:14px; padding:13px 16px; border:1px solid rgba(255,110,135,.22); border-radius:16px; color:var(--danger); background:var(--danger-bg); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); font-size:14px; }
    .error.show { display:block; }
    .results { margin-top:25px; padding-top:23px; border-top:1px solid var(--line); }
    .count { color:var(--success); font-size:13px; font-weight:800; background:var(--success-bg); border:1px solid rgba(89,210,164,.20); box-shadow:var(--inner); padding:7px 11px; border-radius:999px; white-space:nowrap; }
    .links { display:grid; gap:11px; }
    .link-row { padding:10px 10px 10px 16px; border:1px solid var(--glass-edge); border-radius:20px; background:var(--surface); box-shadow:var(--inner); transition:transform .18s,background .18s; }
    .link-row:hover { transform:translateY(-1px); background:var(--glass-strong); }
    .url { flex:1; min-width:0; border:0; background:transparent; color:var(--url); font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; outline:none; }
    .link-row button,.link-row .open-link { min-height:38px; padding:0 14px; font-size:13px; }
    .empty { position:relative; overflow:hidden; padding:38px 16px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:20px; background:rgba(255,255,255,.10); }
    .empty::before { content:"◇"; display:block; margin:0 auto 8px; color:var(--primary); font-size:24px; opacity:.75; }
    .toast { position:fixed; z-index:10; left:50%; bottom:24px; translate:-50% 20px; opacity:0; pointer-events:none; padding:12px 18px; border:1px solid rgba(255,255,255,.32); border-radius:999px; background:rgba(20,27,43,.78); color:#fff; -webkit-backdrop-filter:blur(22px) saturate(180%); backdrop-filter:blur(22px) saturate(180%); font-size:14px; transition:.22s; box-shadow:0 16px 40px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.22); }
    .toast.show { opacity:1; translate:-50% 0; }
    @keyframes drift { from{transform:translate3d(0,0,0) scale(1)} to{transform:translate3d(4vw,3vh,0) scale(1.08)} }
    @media (max-width:720px) {
      .wrap { width:min(100% - 20px,1040px); padding:20px 0 34px; }
      .header-row { align-items:flex-start; padding:15px; border-radius:27px; }
      .title-lockup { align-items:flex-start; gap:12px; }
      .app-icon { flex-basis:48px; width:48px; height:48px; border-radius:15px; }
      .app-icon svg { width:25px; height:25px; }
      h1 { font-size:23px; }
      .intro { margin-top:5px; font-size:13px; }
      .theme-toggle { width:44px; min-height:44px; padding:0; }
      .theme-label { display:none; }
      .card { padding:18px; border-radius:28px; }
      textarea { min-height:270px; border-radius:18px; padding:15px; }
      .link-row { align-items:stretch; flex-wrap:wrap; padding:12px; }
      .url { flex-basis:100%; padding:5px 3px 9px; }
      .link-row button,.link-row .open-link { flex:1; }
      .section-head { align-items:flex-start; flex-direction:column; gap:4px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation:none!important; transition-duration:.01ms!important; } }
  </style>
  <script>
    (() => {
      let saved = null;
      try { saved = localStorage.getItem('beautyplus-theme'); } catch (_) {}
      const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="header-row">
        <div class="title-lockup">
          <div class="app-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path d="M12.4 9.1 8.7 12.8a5.1 5.1 0 0 0 7.2 7.2l3-3" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="m19.6 22.9 3.7-3.7a5.1 5.1 0 0 0-7.2-7.2l-3 3" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
          </div>
          <div class="title-copy">
            <div class="eyebrow">BeautyPlus JSON Tool</div>
            <h1>Trích xuất liên kết</h1>
            <p class="intro">Dán JSON để lấy mọi URL trong <code>data.predictions[].outputUrls</code>, tự động loại trùng và giữ đúng thứ tự.</p>
          </div>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Chuyển sang chế độ tối" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true">☾</span>
          <span class="theme-label">Chế độ tối</span>
        </button>
      </div>
    </header>
    <section class="card">
      <div class="section-head">
        <label for="jsonInput">Nội dung JSON</label>
        <span class="hint">Tự động xử lý khi nhập hoặc dán</span>
      </div>
      <textarea id="jsonInput" spellcheck="false" autocomplete="off" placeholder='Dán JSON BeautyPlus tại đây, ví dụ: {"data":{"predictions":[...]}}'></textarea>
      <div id="error" class="error" role="alert"></div>
      <div class="actions">
        <button id="clearBtn" type="button">Xóa</button>
        <button id="copyAllBtn" class="primary" type="button" disabled>Sao chép tất cả</button>
      </div>
      <div class="results" aria-live="polite">
        <div class="result-head">
          <div class="result-title">Liên kết đã trích xuất</div>
          <span id="count" class="count">0 liên kết</span>
        </div>
        <div id="links" class="links"><div class="empty">Chưa có liên kết nào.</div></div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script>
    (() => {
      const input = document.querySelector('#jsonInput');
      const linksBox = document.querySelector('#links');
      const count = document.querySelector('#count');
      const error = document.querySelector('#error');
      const copyAllBtn = document.querySelector('#copyAllBtn');
      const clearBtn = document.querySelector('#clearBtn');
      const themeToggle = document.querySelector('#themeToggle');
      const themeIcon = themeToggle.querySelector('.theme-icon');
      const themeLabel = themeToggle.querySelector('.theme-label');
      const toast = document.querySelector('#toast');
      let urls = [], timer, toastTimer;

      const showToast = message => {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
      };

      const copyText = async text => {
        try { await navigator.clipboard.writeText(text); }
        catch (_) {
          const helper = document.createElement('textarea');
          helper.value = text; helper.style.position = 'fixed'; helper.style.opacity = '0';
          document.body.appendChild(helper); helper.select(); document.execCommand('copy'); helper.remove();
        }
      };

      const updateThemeButton = () => {
        const isDark = document.documentElement.dataset.theme === 'dark';
        themeToggle.setAttribute('aria-pressed', String(isDark));
        themeToggle.setAttribute('aria-label', isDark ? 'Chuyển sang chế độ sáng' : 'Chuyển sang chế độ tối');
        themeIcon.textContent = isDark ? '☀' : '☾';
        themeLabel.textContent = isDark ? 'Chế độ sáng' : 'Chế độ tối';
      };

      const render = () => {
        count.textContent = `${urls.length} liên kết`;
        copyAllBtn.disabled = urls.length === 0;
        linksBox.replaceChildren();
        if (!urls.length) {
          const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = 'Chưa có liên kết nào.'; linksBox.appendChild(empty); return;
        }
        urls.forEach((url, i) => {
          const row = document.createElement('div'); row.className = 'link-row';
          const field = document.createElement('input'); field.className = 'url'; field.readOnly = true; field.value = url; field.setAttribute('aria-label', `Liên kết ${i + 1}`);
          const open = document.createElement('a'); open.className = 'open-link'; open.href = url; open.target = '_blank'; open.rel = 'noopener noreferrer'; open.textContent = 'Mở';
          const copy = document.createElement('button'); copy.type = 'button'; copy.textContent = 'Sao chép';
          copy.addEventListener('click', async () => { await copyText(url); showToast('Đã sao chép liên kết'); });
          row.append(field, open, copy); linksBox.appendChild(row);
        });
      };

      const parse = () => {
        const raw = input.value.trim(); error.classList.remove('show'); error.textContent = '';
        if (!raw) { urls = []; render(); return; }
        try {
          const json = JSON.parse(raw);
          const predictions = json?.data?.predictions;
          if (!Array.isArray(predictions)) throw new Error('Không tìm thấy mảng data.predictions trong JSON.');
          const seen = new Set(); urls = [];
          predictions.forEach(item => {
            if (!Array.isArray(item?.outputUrls)) return;
            item.outputUrls.forEach(url => { if (typeof url === 'string' && url.trim() && !seen.has(url)) { seen.add(url); urls.push(url); } });
          });
          render();
        } catch (err) {
          urls = []; render(); error.textContent = err instanceof SyntaxError ? 'JSON không hợp lệ. Vui lòng kiểm tra dấu ngoặc, dấu phẩy và dấu ngoặc kép.' : err.message; error.classList.add('show');
        }
      };

      input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(parse, 250); });
      themeToggle.addEventListener('click', () => {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        localStorage.setItem('beautyplus-theme', next);
        updateThemeButton();
      });
      clearBtn.addEventListener('click', () => { clearTimeout(timer); input.value = ''; parse(); input.focus(); });
      copyAllBtn.addEventListener('click', async () => { await copyText(urls.join('\n')); showToast(`Đã sao chép ${urls.length} liên kết`); });
      updateThemeButton();
    })();
  </script>
</body>
</html>
